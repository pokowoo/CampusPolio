
name: Deploy Backend to EKS via ECR

on:
  push:
    branches:
      - feature/eks-cicd
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "Dockerfile"
      - ".github/workflows/deploy-eks-backend.yml"

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: campuspolio-backend
  EKS_DEPLOYMENT_FILE: eks-lab/backend/backend-deployment.yaml

jobs:
  build-and-deploy:
    name: Build, Push and Update EKS Manifest
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Gradle 빌드 및 테스트
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. AWS OIDC 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::034317881539:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      # 5. ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드 및 ECR Push
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 7. EKS Deployment 매니페스트 이미지 태그 변경
      - name: Update Kubernetes Manifest
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E \
            "s|(image: .*amazonaws.com/campuspolio-backend:).*|\1${IMAGE_TAG}|" \
            $EKS_DEPLOYMENT_FILE

          echo "Updated image:"
          grep "image:" $EKS_DEPLOYMENT_FILE

      # 8. 변경된 매니페스트 GitHub Push
      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $EKS_DEPLOYMENT_FILE

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "chore: update backend image to ${GITHUB_SHA}"
          git push origin HEAD:${GITHUB_REF_NAME}
