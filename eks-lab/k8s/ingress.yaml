apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  namespace: default
  annotations:
    # 인터넷 공개 ALB 생성
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Pod IP로 직접 트래픽 전달
    alb.ingress.kubernetes.io/target-type: ip
    # HTTP 80 및 HTTPS 443 리스너 생성
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # ACM 인증서 연결
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:034317881539:certificate/d2711776-7aeb-4233-8cfc-ffb7c85fe906
    # HTTP 요청을 HTTPS 443으로 리다이렉트
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - host: hello.campuspolio.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
