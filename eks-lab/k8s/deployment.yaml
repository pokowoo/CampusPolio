
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: 034317881539.dkr.ecr.ap-northeast-2.amazonaws.com/campuspolio-hello:fdab4ac368b92d2ff5d64357dcbfdb726ee403f4
          args:
            - "-text=Hello from CampusPolio EKS!"
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
