
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuspolio-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campuspolio-backend
  template:
    metadata:
      labels:
        app: campuspolio-backend
    spec:
      serviceAccountName: campuspolio-backend-sa
      containers:
        - name: campuspolio-backend
          image: 034317881539.dkr.ecr.ap-northeast-2.amazonaws.com/campuspolio-backend:19eaf5e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          envFrom:
            - secretRef:
                name: campuspolio-backend-secret
