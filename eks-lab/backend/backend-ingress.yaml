apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campuspolio-backend
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:034317881539:certificate/10bc574c-034d-4792-89b1-d62238f2cfd1
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - host: api.campuspolio.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campuspolio-backend
                port:
                  number: 8080