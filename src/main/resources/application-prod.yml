spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  session:
    store-type: redis
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  level:
    org.hibernate.SQL: debug

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
server:
  forward-headers-strategy: framework
springdoc:
  swagger-ui:
    disable-swagger-default-url: true

  api-docs:
    enabled: true

  override-with-generic-response: false
cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: campuspolio-storage-2026


claude:
  api-key: ${CLAUDE_API_KEY}
